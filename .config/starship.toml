# starship.toml — generated by Starship Prompt Builder (https://starship.ndl.au)
# Save to ~/.config/starship.toml (or $STARSHIP_CONFIG).
# Reference: https://starship.rs/config/

"$schema" = "https://starship.rs/config-schema.json"
format = "$os($username$hostname )$directory($git_branch$git_commit$git_state$git_metrics$git_status) $cmd_duration$java$python$character"
add_newline = false
palette = "catppuccin_latte"

# Timeout for scanning files in the current directory (milliseconds)
scan_timeout = 500

# Timeout for commands executed by Starship (milliseconds)
command_timeout = 2000

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[directory]
#style = "bg:peach fg:crust"
style = "sapphire"
format = "[$path]($style)"
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = ""
Music = "󰝚"
Pictures = ""
Developer = "󰲋"

[git_branch]
format = "( [$branch]($style))"
style = "italic bright-black"
ignore_branches = ["HEAD"]

[git_commit]
tag_disabled = false
style = "italic bright-black"
format = '( [\($hash$tag\)]($style))'

[git_state]
style = "italic bright-black"
format = '( \([$state( $progress_current/$progress_total)]($style)\))'

[git_metrics]
disabled = false
added_style = "italic green"
deleted_style = "italic red"
format = '( [+$added]($added_style))( [-$deleted]($deleted_style))'

[git_status]
style = "italic bright-black"
format = "([( $conflicted)( $untracked)( $modified)( $staged)( $renamed)( $deleted)( $ahead_behind)( $stashed)]($style))"
conflicted    = "=${count}"
untracked     = "?${count}"
modified      = "!${count}"
staged        = "+${count}"
renamed       = "»${count}"
deleted       = "✘${count}"
stashed       = "≡${count}"
ahead         = "⇡${count}"
behind        = "⇣${count}"
diverged      = "⇕⇡${ahead_count}⇣${behind_count}"

[hostname]
ssh_symbol = "@"
format = "([$ssh_symbol](bright-black)[$hostname]($style))"
style = "bold peach"

[os]
disabled = false

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
detect_extensions = [ "py", "pyw", "pyi", "ipynb" ]
detect_files = [ "requirements.txt", "pyproject.toml", "pyvenv.cfg", "setup.py", "tox.ini", "Pipfile" ]
detect_folders = [ ".venv", "venv" ]

[java]
format = "[$symbol([$version](bold dimmed red) )]($style)"

[username]
format = "[$user]($style)"
