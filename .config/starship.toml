# starship.toml — generated by Starship Prompt Builder (https://starship.ndl.au)
# Save to ~/.config/starship.toml (or $STARSHIP_CONFIG).
# Reference: https://starship.rs/config/

"$schema" = "https://starship.rs/config-schema.json"
format = "$os$username$hostname$directory$git_branch$git_commit$git_state$git_metrics$git_status$cmd_duration$java$python$custom$character"
add_newline = false
palette = "catppuccin_latte"
command_timeout = 1000

[palettes.gruvbox_dark]
color_fg0 = "#fbf1c7"
color_bg1 = "#3c3836"
color_bg3 = "#665c54"
color_blue = "#458588"
color_aqua = "#689d6a"
color_green = "#98971a"
color_orange = "#d65d0e"
color_purple = "#b16286"
color_red = "#cc241d"
color_yellow = "#d79921"

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[directory]
style = "blue"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]

[git_branch]
format = "[|](bold overlay1) [$branch]($style) "
style = "italic bright-black"

[git_commit]
only_detached = true
tag_disabled = false
tag_symbol = " 🏷  "
style = "italic bold yellow"
format = '[\($hash$tag\)]($style) '

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "italic green"
deleted_style = "italic red"

[git_state]
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted )](218)($ahead_behind )($stashed)]($style)[|](bold overlay1) "
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡ "

[custom.mascot_linux]
command = "shuf -n1 -e 🐧 🦀 🐙 🦊 🐢 🦉 🐱 🐺 🦝 🦔"
when = "true"
format = "[$output](bold)"

[custom.mascot_macos]
when = "true"
command = '''awk 'BEGIN{srand(); split("🐧 🦀 🐙 🦊 🐢 🦉 🐱 🐺 🦝 🦔",a," "); print a[int(rand()*10)+1]}' '''
format = "[$output ]($style)"
os = "macos"

[custom.mascot_windows]
when = true
command = '''$a = @('🐧','🦀','🐙','🦊','🐢','🦉','🐱','🐺','🦝','🦔'); Get-Random -InputObject $a'''
shell = ["powershell.exe", "-NoProfile", "-Command", "-"]
format = "[$output ]($style)"
style = "bold"
os = "windows"

[hostname]
ssh_symbol = "@"
format = "[($ssh_symbol$hostname )]($style)"
style = "bold peach"

[os]
disabled = false

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
symbol = "🐍 "
style = "yellow bold"
detect_extensions = ["py", "pyw", "pyi", "ipynb"]
detect_files = ["requirements.txt", "pyproject.toml", "pyvenv.cfg", "setup.py", "tox.ini", "Pipfile"]
detect_folders = [".venv", "venv"]

[username]
format = "[$user]($style)"
